<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>For Moulik ♡</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #ffd1e4;
    font-family: Georgia, "Times New Roman", serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display:block; width:100%; height:100%; touch-action: manipulation; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: max(34px, env(safe-area-inset-bottom));
    text-align:center; font-size: 12px; letter-spacing: 3px;
    color: rgba(255,205,226,.58); opacity: 0;
    transition: opacity 1.2s ease; pointer-events:none;
  }
  #message {
    position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap: 15px; padding: 28px; text-align:center;
    background: rgba(0,0,0,0); opacity:0; pointer-events:none;
    transition: opacity 1.1s ease;
  }
  #message.show { opacity:1; background:rgba(0,0,0,.28); }
  #message p {
    margin:0; max-width: 330px; font-size: clamp(23px, 6vw, 34px);
    line-height:1.35; color:#ffd5e7;
    text-shadow: 0 0 14px rgba(255,133,188,.48), 0 0 32px rgba(255,133,188,.2);
  }
  #message span { font-size:25px; color:#ff9fc9; text-shadow:0 0 18px #ff7eb7; }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<div id="hint">TAP ANYWHERE</div>
<div id="message"><p>I love you, Moulik. That's the whole message.</p><span>♡</span></div>
<script>
(() => {
  const canvas = document.getElementById('heart');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hint = document.getElementById('hint');
  const message = document.getElementById('message');

  let W = 0, H = 0, dpr = 1, particles = [], formedAt = 0;
  let isFormed = false, revealed = false, startTime = performance.now();
  const COUNT = 2550;
  const pinks = ['#ffd2e5','#ffc0dc','#ffacd1','#ffdaea','#ffb8d7'];

  function heartPoint() {
    // Uniform rejection sampling inside the filled implicit heart.
    while (true) {
      const x = Math.random() * 2.25 - 1.125;
      const y = Math.random() * 2.15 - 1.05;
      const a = x*x + y*y - 1;
      if (a*a*a - x*x*y*y*y <= 0) return {x, y};
    }
  }

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const unit = Math.min(W * 0.39, H * 0.36, 205);
    const cx = W/2, cy = H/2 - Math.min(10, H*.015);
    particles = [];
    for (let i=0; i<COUNT; i++) {
      const p = heartPoint();
      // Conventional heart equation has its point at y=-1.
      const tx = cx + p.x * unit;
      const ty = cy - p.y * unit;
      const angle = Math.random()*Math.PI*2;
      const radius = Math.max(W,H) * (0.35 + Math.random()*0.7);
      particles.push({
        sx: cx + Math.cos(angle)*radius,
        sy: cy + Math.sin(angle)*radius,
        tx, ty,
        x: cx + (Math.random()-.5)*W*1.8,
        y: cy + (Math.random()-.5)*H*1.8,
        size: .65 + Math.random()*1.25,
        phase: Math.random()*Math.PI*2,
        speed: .65 + Math.random()*1.1,
        alpha: .58 + Math.random()*.42,
        color: pinks[Math.floor(Math.random()*pinks.length)]
      });
    }
    startTime = performance.now();
    isFormed = false; revealed = false;
    message.classList.remove('show');
    hint.style.opacity = 0;
  }

  function ease(t) { return 1 - Math.pow(1-t, 3); }

  function draw(now) {
    const elapsed = now - startTime;
    const gather = Math.min(1, elapsed / 3100);
    const e = ease(gather);
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,W,H);

    const pulse = gather >= 1 ? 1 + Math.sin(now*.0017)*.018 : 1;
    const cx=W/2, cy=H/2 - Math.min(10,H*.015);
    for (const p of particles) {
      const drift = (1-e);
      const wobbleX = Math.sin(now*.00045 + p.phase)*7*drift;
      const wobbleY = Math.cos(now*.0004 + p.phase)*7*drift;
      const x = p.sx + (p.tx-p.sx)*e;
      const y = p.sy + (p.ty-p.sy)*e;
      const px = cx + (x-cx)*pulse + wobbleX;
      const py = cy + (y-cy)*pulse + wobbleY;
      const twinkle = .68 + .32*Math.sin(now*.002*p.speed + p.phase);
      const alpha = p.alpha * twinkle * (gather < 1 ? .35 + .65*e : 1);
      const r = p.size * (gather >= 1 ? 1 + .12*Math.sin(now*.0015+p.phase) : 1);
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = gather > .55 ? 7 : 2;
      ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    if (gather >= 1 && !isFormed) {
      isFormed = true;
      formedAt = now;
      hint.style.opacity = 1;
    }
    requestAnimationFrame(draw);
  }

  function reveal() {
    if (!isFormed || revealed) return;
    revealed = true;
    hint.style.opacity = 0;
    message.classList.add('show');
  }

  canvas.addEventListener('pointerdown', reveal);
  message.addEventListener('pointerdown', () => {
    message.classList.remove('show');
    revealed = false;
    hint.style.opacity = 1;
  });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
