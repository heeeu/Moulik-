<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>For Moulik ♡</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#000;color:#ffd1e4;
 font-family:Georgia,"Times New Roman",serif;
 -webkit-tap-highlight-color:transparent
}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#hint{
 position:fixed;left:0;right:0;
 bottom:max(34px,env(safe-area-inset-bottom));
 text-align:center;font-size:12px;letter-spacing:3px;
 color:rgba(255,205,226,.58);
 opacity:0;transition:opacity 1.2s;pointer-events:none
}
#message{
 position:fixed;inset:0;display:flex;
 align-items:center;justify-content:center;
 flex-direction:column;gap:15px;padding:28px;
 text-align:center;background:rgba(0,0,0,0);
 opacity:0;pointer-events:none;transition:opacity 1.1s
}
#message.show{opacity:1;background:rgba(0,0,0,.28)}
#message p{
 margin:0;max-width:330px;
 font-size:clamp(23px,6vw,34px);line-height:1.35;
 color:#ffd5e7;
 text-shadow:0 0 14px rgba(255,133,188,.48),
 0 0 32px rgba(255,133,188,.2)
}
#message span{
 font-size:25px;color:#ff9fc9;
 text-shadow:0 0 18px #ff7eb7
}
</style>
</head>

<body>

<canvas id="heart"></canvas>
<div id="hint">TAP ANYWHERE</div>

<div id="message">
 <p>I love you, Moulik.</p>
 <span>♡</span>
</div>

<script>
(()=>{
const canvas=document.getElementById('heart');
const ctx=canvas.getContext('2d',{alpha:false});
const hint=document.getElementById('hint');
const message=document.getElementById('message');

let W=0,H=0,dpr=1,particles=[];
let startTime=0,isFormed=false,revealed=false;

const COUNT=2800;

const borderPinks=[
 '#fff0f7','#ffd2e8','#ffb5d5',
 '#ff9fc9','#ffe0ef'
];

const innerPinks=[
 '#ffc9e1','#f8b5d2','#ffd9e9',
 '#f5a9cb'
];

// Filled heart with boundary-distance detection.
function heartPoint(edgeOnly=false){

 while(true){

  const x=Math.random()*2.8-1.4;
  const y=Math.random()*2.65-1.05;

  const v=x*x+y*y-1;
  const f=v*v*v-x*x*y*y*y;

  if(f<=0){

   const gx=6*x*v*v-2*x*y*y*y;
   const gy=6*y*v*v-3*x*x*y*y;

   const gradient=Math.hypot(gx,gy)||1;
   const distance=Math.abs(f)/gradient;

   const edge=distance<0.045;

   if(!edgeOnly||edge){
    return{x,y,edge:true};
   }

   if(edge){
    return{x,y,edge:true};
   }

   return{x,y,edge:false};
  }
 }
}

function resize(){

 W=innerWidth;
 H=innerHeight;
 dpr=Math.min(devicePixelRatio||1,2);

 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);

 const unit=Math.min(W*.34,H*.265,185);
 const cx=W/2,cy=H/2-4;

 particles=[];

 for(let i=0;i<COUNT;i++){

  const edgeOnly=i<Math.floor(COUNT*.38);
  const p=heartPoint(edgeOnly);

  const a=Math.random()*Math.PI*2;
  const r=Math.max(W,H)*(.35+Math.random()*.7);

  const lower=Math.max(0,-p.y);
  const taper=1-0.20*Math.pow(lower,1.25);

  const edge=p.edge;

  particles.push({

   sx:cx+Math.cos(a)*r,
   sy:cy+Math.sin(a)*r,

   tx:cx+p.x*unit*taper,
   ty:cy-p.y*unit,

   edge,

   size:edge
    ?1.0+Math.random()*.85
    :.45+Math.random()*.65,

   phase:Math.random()*Math.PI*2,
   speed:.65+Math.random()*1.1,

   alpha:edge
    ?.82+Math.random()*.18
    :.35+Math.random()*.35,

   color:edge
    ?borderPinks[Math.floor(Math.random()*borderPinks.length)]
    :innerPinks[Math.floor(Math.random()*innerPinks.length)]
  });
 }

 startTime=performance.now();
 isFormed=false;
 revealed=false;

 message.classList.remove('show');
 hint.style.opacity=0;
}

const ease=t=>1-Math.pow(1-t,3);

function draw(now){

 const t=Math.min(1,(now-startTime)/3100);
 const e=ease(t);

 const pulse=t>=1
  ?1+Math.sin(now*.0017)*.018
  :1;

 const cx=W/2,cy=H/2-4;

 ctx.fillStyle='#000';
 ctx.fillRect(0,0,W,H);

 for(const p of particles){

  const drift=1-e;

  const x=p.sx+(p.tx-p.sx)*e;
  const y=p.sy+(p.ty-p.sy)*e;

  const px=cx+(x-cx)*pulse+
   Math.sin(now*.00045+p.phase)*7*drift;

  const py=cy+(y-cy)*pulse+
   Math.cos(now*.0004+p.phase)*7*drift;

  const shimmer=.5+.5*Math.sin(
   now*(p.edge?.006:.0025)*p.speed+p.phase
  );

  if(p.edge){

   ctx.globalAlpha=
    p.alpha*(.65+.35*shimmer)*
    (t<1?.35+.65*e:1);

   ctx.shadowBlur=10+12*shimmer;

  }else{

   ctx.globalAlpha=
    p.alpha*(.65+.35*shimmer)*
    (t<1?.35+.65*e:1);

   ctx.shadowBlur=2.5+2*shimmer;
  }

  ctx.shadowColor=p.color;
  ctx.fillStyle=p.color;

  const size=p.edge
   ?p.size*(1+.35*shimmer)
   :p.size*(.9+.12*shimmer);

  ctx.beginPath();
  ctx.arc(px,py,size,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;

 if(t>=1&&!isFormed){
  isFormed=true;
  hint.style.opacity=1;
 }

 requestAnimationFrame(draw);
}

function reveal(){

 if(!isFormed||revealed)return;

 revealed=true;
 hint.style.opacity=0;
 message.classList.add('show');
}

canvas.addEventListener('pointerdown',reveal);

message.addEventListener('pointerdown',()=>{
 message.classList.remove('show');
 revealed=false;
 hint.style.opacity=1;
});

addEventListener('resize',resize);

resize();
requestAnimationFrame(draw);

})();
</script>

</body>
</html>
